<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">订阅管理系统</title>
  <desc id="desc">跑在 Cloudflare Workers 上的到期提醒。到期按公历算，周期可走农历。右侧三张台历撕页来自项目自己的农历表：Netflix 9月7日七月廿六剩余3天，iCloud 9月10日七月廿九按月续，妈妈生日农历八月十一——今年公历9月21日，明年会漂到9月11日。</desc>

  <defs>
    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="18"/>
    </clipPath>
    <clipPath id="pad-clip">
      <rect x="40" y="28" width="1120" height="364" rx="16"/>
    </clipPath>
    <pattern id="perf" width="28" height="20" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="10" r="3.6" fill="#1A1714"/>
    </pattern>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="420" fill="#1A1714"/>

    <!-- desk calendar pad -->
    <rect x="40" y="28" width="1120" height="364" rx="16" fill="#F6F0E6"/>
    <g clip-path="url(#pad-clip)">
      <rect x="40" y="28" width="1120" height="20" fill="url(#perf)"/>
    </g>

    <!-- printed header -->
    <text x="64" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, 'Noto Sans Mono CJK SC', monospace" font-size="16" font-weight="700" letter-spacing="1.6" fill="#C4452D">CLOUDFLARE WORKERS · 台历</text>
    <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="48" font-weight="700" fill="#1F1A16">订阅管理系统</text>
    <text x="64" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="600" fill="#5E7F8A">到期按公历算，周期可走农历。</text>

    <!-- 08:00 cron stamp -->
    <g transform="translate(1088 118)">
      <circle r="44" fill="none" stroke="#C4452D" stroke-width="2.4"/>
      <circle r="37" fill="none" stroke="#C4452D" stroke-width="1"/>
      <text y="-4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#C4452D">08:00</text>
      <text y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C4452D">UTC</text>
    </g>

    <!-- tear-off page 1: Netflix, D-3 -->
    <g transform="translate(64 186)">
      <rect width="336" height="186" rx="8" fill="#FFFBF4" stroke="#E4D9C8"/>
      <rect width="336" height="18" rx="8" fill="#F3D9CF"/>
      <rect y="10" width="336" height="10" fill="#F3D9CF"/>
      <g fill="#C4452D">
        <circle cx="28" cy="10" r="3.2"/>
        <circle cx="56" cy="10" r="3.2"/>
        <circle cx="84" cy="10" r="3.2"/>
        <circle cx="112" cy="10" r="3.2"/>
        <circle cx="140" cy="10" r="3.2"/>
        <circle cx="168" cy="10" r="3.2"/>
        <circle cx="196" cy="10" r="3.2"/>
        <circle cx="224" cy="10" r="3.2"/>
        <circle cx="252" cy="10" r="3.2"/>
        <circle cx="280" cy="10" r="3.2"/>
        <circle cx="308" cy="10" r="3.2"/>
      </g>
      <rect x="0" y="18" width="6" height="168" fill="#C4452D"/>
      <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="56" font-weight="700" fill="#1F1A16">7</text>
      <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#5E7F8A">七月廿六</text>
      <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#1F1A16">Netflix</text>
      <text x="24" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#9B9186">流媒体 · 提前 7 天</text>
      <rect x="236" y="56" width="80" height="32" rx="6" fill="#C4452D"/>
      <text x="276" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#FFFBF4">D-3</text>
    </g>

    <!-- tear-off page 2: iCloud, monthly -->
    <g transform="translate(432 186)">
      <rect width="336" height="186" rx="8" fill="#FFFBF4" stroke="#E4D9C8"/>
      <rect width="336" height="18" rx="8" fill="#EDE4D6"/>
      <rect y="10" width="336" height="10" fill="#EDE4D6"/>
      <g fill="#9B9186">
        <circle cx="28" cy="10" r="3.2"/>
        <circle cx="56" cy="10" r="3.2"/>
        <circle cx="84" cy="10" r="3.2"/>
        <circle cx="112" cy="10" r="3.2"/>
        <circle cx="140" cy="10" r="3.2"/>
        <circle cx="168" cy="10" r="3.2"/>
        <circle cx="196" cy="10" r="3.2"/>
        <circle cx="224" cy="10" r="3.2"/>
        <circle cx="252" cy="10" r="3.2"/>
        <circle cx="280" cy="10" r="3.2"/>
        <circle cx="308" cy="10" r="3.2"/>
      </g>
      <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="56" font-weight="700" fill="#1F1A16">10</text>
      <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#5E7F8A">七月廿九</text>
      <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#1F1A16">iCloud</text>
      <text x="24" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#9B9186">云服务 · 1 个月</text>
      <rect x="228" y="56" width="88" height="32" rx="6" fill="#EDE4D6"/>
      <text x="272" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#5C534A">D-6</text>
    </g>

    <!-- tear-off page 3: lunar birthday -->
    <g transform="translate(800 186)">
      <rect width="336" height="186" rx="8" fill="#FFFBF4" stroke="#E4D9C8"/>
      <rect width="336" height="18" rx="8" fill="#DCE6E8"/>
      <rect y="10" width="336" height="10" fill="#DCE6E8"/>
      <g fill="#5E7F8A">
        <circle cx="28" cy="10" r="3.2"/>
        <circle cx="56" cy="10" r="3.2"/>
        <circle cx="84" cy="10" r="3.2"/>
        <circle cx="112" cy="10" r="3.2"/>
        <circle cx="140" cy="10" r="3.2"/>
        <circle cx="168" cy="10" r="3.2"/>
        <circle cx="196" cy="10" r="3.2"/>
        <circle cx="224" cy="10" r="3.2"/>
        <circle cx="252" cy="10" r="3.2"/>
        <circle cx="280" cy="10" r="3.2"/>
        <circle cx="308" cy="10" r="3.2"/>
      </g>
      <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="56" font-weight="700" fill="#1F1A16">21</text>
      <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" fill="#5E7F8A">八月十一</text>
      <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="22" font-weight="700" fill="#1F1A16">妈妈生日</text>
      <text x="24" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#9B9186">农历年 · 公历会漂</text>
      <g transform="translate(292 72)">
        <circle r="22" fill="none" stroke="#C4452D" stroke-width="1.8"/>
        <text y="7" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="700" fill="#C4452D">农</text>
      </g>
    </g>
  </g>
</svg>
